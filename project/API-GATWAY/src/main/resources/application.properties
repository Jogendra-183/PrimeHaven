spring.application.name=API-GATWAY

server.port=6001

# Eureka props
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Discovery locator (modern Spring Cloud Gateway WebFlux)
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Dedupe CORS headers from downstream services to prevent duplicate headers in browser
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# Routes
spring.cloud.gateway.server.webflux.routes[0].id=AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/user/**, /admin/**, /auth/**, /signup, /signin, /login, /register

spring.cloud.gateway.server.webflux.routes[1].id=PROPERTY-SERVICE
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PROPERTY-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/properties/**, /property/**

spring.cloud.gateway.server.webflux.routes[2].id=VISIT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].uri=lb://VISIT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/visits/**, /visit/**

spring.cloud.gateway.server.webflux.routes[3].id=INQUIRY-SERVICE
spring.cloud.gateway.server.webflux.routes[3].uri=lb://INQUIRY-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/inquiries/**, /inquiry/**

# Global CORS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG
logging.level.reactor.netty=INFO
